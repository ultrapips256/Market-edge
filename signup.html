<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Market Edge</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a09;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #101411;
      border: 1px solid #1e3a29;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .green { color: #39d98a; }

    .sub {
      text-align: center;
      color: #9ca8a0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #d8dedb;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #294234;
      background: #080a09;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #39d98a;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #39d98a;
      color: #06100a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      color: #9ca8a0;
    }

    a {
      color: #39d98a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Market <span class="green">Edge</span></h1>

    <p class="sub">Create your account</p>

    <form id="signupForm">

      <label>Full Name</label>
      <input type="text" id="fullName" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" minlength="8" required>

      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" minlength="8" required>

      <button type="submit" id="signupBtn">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="links">
      Already have an account?
      <a href="login.html">Log in</a>
      <br><br>
      <a href="index.html">← Back to Market Edge</a>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("signupBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      message.textContent = "";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Create Account";
        return;
      }

      message.textContent =
        "Account created! Check your email if verification is required.";

      form.reset();
      button.disabled = false;
      button.textContent = "Create Account";
    });
  </script>

</body>
</html>
