<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Edge | Trading Signals</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070a0d;
  color:#f5f5f5;
  line-height:1.6;
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

nav{
  border-bottom:1px solid #1c252b;
  background:#070a0d;
  padding:20px 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
  font-size:21px;
  letter-spacing:1px;
}

.logo span{
  color:#35e58c;
}

.back{
  color:#35e58c;
  font-size:14px;
}

.hero{
  text-align:center;
  padding:80px 0 55px;
  background:radial-gradient(circle at center,
  rgba(53,229,140,.12),transparent 45%);
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero h1 span{
  color:#35e58c;
}

.hero p{
  color:#9aa3a8;
  max-width:650px;
  margin:auto;
}

.section{
  padding:55px 0;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#0c1115;
  border:1px solid #1d272d;
  border-radius:15px;
  padding:30px;
}

.card:hover{
  border-color:#35e58c;
}

.card h2{
  margin-bottom:10px;
}

.card p{
  color:#929ba1;
  font-size:14px;
}

.price{
  font-size:35px;
  font-weight:900;
  margin:20px 0;
}

.price span{
  font-size:13px;
  color:#7d878d;
  font-weight:normal;
}

.features{
  list-style:none;
  color:#aeb5ba;
  font-size:14px;
}

.features li{
  margin:12px 0;
}

.features li:before{
  content:"✓";
  color:#35e58c;
  margin-right:8px;
}

.btn{
  display:block;
  text-align:center;
  margin-top:25px;
  padding:13px;
  border-radius:8px;
  background:#35e58c;
  color:#06100a;
  font-weight:900;
}

.example{
  background:#0c1115;
  border:1px solid #1d272d;
  border-radius:15px;
  padding:25px;
  margin-top:25px;
}

.example h3{
  margin-bottom:15px;
}

.signal{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.signal div{
  background:#080c0f;
  padding:13px;
  border-radius:7px;
  border:1px solid #1b242a;
}

.signal small{
  display:block;
  color:#727c82;
}

.signal strong{
  color:#35e58c;
}

.note{
  color:#747e84;
  font-size:12px;
  margin-top:18px;
}

.disclaimer{
  border-top:1px solid #1c252b;
  margin-top:50px;
  padding:25px 0;
  color:#687177;
  font-size:11px;
}
