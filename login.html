<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Edge | Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#0b0b0b;
  border:1px solid #222;
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 30px rgba(25,255,117,.06);
}

.logo{
  text-align:center;
  color:#19ff75;
  font-size:25px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
}

h1{
  text-align:center;
  font-size:28px;
  margin-bottom:25px;
}

label{
  display:block;
  color:#bbb;
  font-size:14px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  background:#050505;
  color:white;
  border:1px solid #292929;
  border-radius:10px;
  outline:none;
  margin-bottom:18px;
}

input:focus{
  border-color:#19ff75;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#19ff75;
  color:#000;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.forgot{
  display:block;
  text-align:right;
  color:#19ff75;
  font-size:13px;
  text-decoration:none;
  margin-top:-8px;
  margin-bottom:20px;
}

.signup{
  text-align:center;
  color:#888;
  margin-top:22px;
  font-size:14px;
}

.signup a{
  color:#19ff75;
  text-decoration:none;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  color:#777;
  text-decoration:none;
  margin-top:20px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">MARKET EDGE</div>

  <p class="subtitle">Trade. Learn. Evolve.</p>

  <h1>Welcome Back</h1>

  <form>

    <label>Email Address</label>
    <input
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      placeholder="Enter your password"
      required
    >

    <a href="#" class="forgot">
      Forgot password?
    </a>

    <button type="submit">
      Login
    </button>

  </form>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

  <a href="index.html" class="back">
    ← Back to Market Edge
  </a>

</div>

</body>
</html>
